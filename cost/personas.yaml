# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 143
  base: 436
  high: 721
  source: "thấp = 143 học viên đã hỏi trợ giảng AI trong chat.csv (cost/count_personas.py); cơ sở = 436 học viên có hoạt động, cao = 721 tài khoản (README data pack preclass của BTC, 05/11→25/11/2026). Cơ sở / cao giả định mọi người dùng giống nhóm đã hỏi TA (tự ước tính) → có thể đội chi phí lên"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.52             # tỉ lệ người dùng kiểu này — 75/143 người, dưới 2 phiên / tháng
    uses_per_month: 1.4     # số phiên / người / tháng
    turns_per_session: 3    # số lượt hỏi trong một phiên (đo được 2.9)
    source: "data BTC chat.csv (05/11→25/11/2026, 21 ngày): 1.090 lượt hỏi trợ giảng dưới video — cùng tập với evidence/data-mining.md và spec §2; phiên = các lượt cách nhau ≤30 phút (tự chọn); chạy lại: cost/count_personas.py"
  - name: dung_vua
    share: 0.40             # 57/143 người, 2–6 phiên / tháng
    uses_per_month: 3.8
    turns_per_session: 4    # đo được 3.7
    source: "data BTC chat.csv (05/11→25/11/2026, 21 ngày): 1.090 lượt hỏi trợ giảng dưới video — cùng tập với evidence/data-mining.md và spec §2; phiên = các lượt cách nhau ≤30 phút (tự chọn); chạy lại: cost/count_personas.py"
  - name: dung_nhieu
    share: 0.08             # 11/143 người, từ 6 phiên / tháng
    uses_per_month: 11.3
    turns_per_session: 4    # đo được 3.7
    source: "data BTC chat.csv (05/11→25/11/2026, 21 ngày): 1.090 lượt hỏi trợ giảng dưới video — cùng tập với evidence/data-mining.md và spec §2; phiên = các lượt cách nhau ≤30 phút (tự chọn); chạy lại: cost/count_personas.py"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gpt-5-nano      # tầng Nhỏ
    input: 0.05
    output: 0.40
    source: "further-reading/model-prices.md (repo đề) · https://developers.openai.com/api/docs/pricing · BTC xem 25/11/2026"
  - model: gpt-6.1-terra   # tầng Vừa
    input: 1.00
    output: 5.00
    source: "further-reading/model-prices.md (repo đề) · https://developers.openai.com/api/docs/pricing · BTC xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
